<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — O Último Segredo da Humanidade</title>
  <style>
    :root {
      --bg: #070b14;
      --bg2: #0b1120;
      --bg3: #15213b;
      --tx: #e2e8f0;
      --tx2: #94a3b8;
      --acc: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--tx); padding: 2rem; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: #fff; font-weight: 700; }
    
    /* LOGIN FORM */
    #login-box { max-width: 400px; margin: 5rem auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; text-align: center; }
    input[type="password"], input[type="text"] { width: 100%; padding: 0.75rem 1rem; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 1rem; outline: none; }
    button { padding: 0.75rem 1.5rem; background: var(--acc); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    button:hover { opacity: 0.9; }

    /* DASHBOARD */
    #dashboard { display: none; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card-stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
    .card-stat .label { font-size: 0.75rem; color: var(--tx2); text-transform: uppercase; letter-spacing: 0.1em; }
    .card-stat .value { font-size: 1.8rem; font-weight: 800; color: #fff; margin-top: 4px; }

    /* TABLE */
    .table-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { background: var(--bg3); padding: 1rem; color: var(--tx2); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    td { padding: 1rem; border-top: 1px solid var(--border); }
    tr:hover { background: rgba(56, 189, 248, 0.03); }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.72rem; font-family: monospace; font-weight: 700; display: inline-block; }
    .badge-paid { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-free { background: rgba(56, 189, 248, 0.15); color: var(--acc); border: 1px solid rgba(56, 189, 248, 0.3); }
    .btn-action { padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn-grant { background: var(--green); color: #fff; }
    .btn-revoke { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <!-- CAIXA DE LOGIN -->
  <div id="login-box">
    <h2 style="margin-bottom:1rem; font-size:1.2rem; color:#fff;">Acesso Administrativo</h2>
    <input type="password" id="admin-pass" placeholder="Digite a senha de administrador" onkeyup="if(event.key==='Enter') loginAdmin()">
    <button onclick="loginAdmin()">ENTRAR NO PAINEL</button>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="dashboard" class="container">
    <div class="header">
      <h1>Painel Admin — Leitores & Vendas</h1>
      <div>
        <input type="text" id="search-input" placeholder="🔍 Buscar leitor por nome ou e-mail..." oninput="filterReaders()" style="width:280px; margin-bottom:0;">
      </div>
    </div>

    <!-- CARDS DE ESTATÍSTICAS -->
    <div class="grid-stats">
      <div class="card-stat">
        <div class="label">Total de Leitores</div>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="card-stat">
        <div class="label">Leitores Confirmados (Pagos)</div>
        <div class="value" style="color:var(--green);" id="stat-paid">0</div>
      </div>
      <div class="card-stat">
        <div class="label">Em Degustação (Grátis)</div>
        <div class="value" style="color:var(--acc);" id="stat-free">0</div>
      </div>
      <div class="card-stat">
        <div class="label">Faturamento Estimado</div>
        <div class="value" style="color:#eab308;" id="stat-revenue">R$ 0,00</div>
      </div>
    </div>

    <!-- TABELA DE LEITORES -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Leitor</th>
            <th>E-mail / WhatsApp</th>
            <th>Status</th>
            <th>Corrente (Indicados)</th>
            <th>Código / Ref</th>
            <th>Cadastro</th>
            <th>Ações de Suporte</th>
          </tr>
        </thead>
        <tbody id="readers-tbody">
          <!-- Linhas injetadas via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let adminToken = '';
    let allReaders = [];

    async function loginAdmin() {
      const pass = document.getElementById('admin-pass').value.trim();
      if (!pass) return alert('Digite a senha.');

      adminToken = pass;
      await fetchDashboardData();
    }

    async function fetchDashboardData() {
      try {
        const res = await fetch('/api/admin', {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          alert(data.error || 'Senha incorreta (Status: ' + res.status + ').');
          return;
        }

        document.getElementById('login-box').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        allReaders = data.readers || [];

        // Atualiza Stats
        document.getElementById('stat-total').innerText = data.stats.totalReaders;
        document.getElementById('stat-paid').innerText = data.stats.paidReaders;
        document.getElementById('stat-free').innerText = data.stats.freeReaders;
        document.getElementById('stat-revenue').innerText = 'R$ ' + (data.stats.totalRevenue || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2});

        renderTable(allReaders);
      } catch (err) {
        alert('Erro ao conectar com o servidor.');
      }
    }

    function renderTable(readers) {
      const tbody = document.getElementById('readers-tbody');
      tbody.innerHTML = '';

      readers.forEach(r => {
        const tr = document.createElement('tr');
        const isPaid = r.status === 'paid';
        const dateStr = new Date(r.created_at).toLocaleDateString('pt-BR');

        tr.innerHTML = `
          <td><strong>${r.name}</strong></td>
          <td>${r.email}<br><span style="color:var(--tx2); font-size:0.75rem;">${r.phone || 'Sem WhatsApp'}</span></td>
          <td><span class="badge ${isPaid ? 'badge-paid' : 'badge-free'}">${isPaid ? 'CONFIRMADO (R$49)' : 'DEGUSTAÇÃO'}</span></td>
          <td><strong style="color:var(--acc);">${r.referrals_count || 0}</strong> leitores</td>
          <td><code style="font-size:0.75rem;">${r.referral_code}</code>${r.referred_by ? `<br><span style="font-size:0.7rem; color:var(--tx2);">Veio por: ${r.referred_by}</span>` : ''}</td>
          <td>${dateStr}</td>
          <td>
            ${isPaid 
              ? `<button class="btn-action btn-revoke" onclick="toggleAccess('${r.id}', 'revoke-access')">Revogar Acesso</button>`
              : `<button class="btn-action btn-grant" onclick="toggleAccess('${r.id}', 'grant-access')">⚡ Liberar Acesso</button>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function toggleAccess(readerId, action) {
      if (!confirm('Deseja alterar o status de acesso deste leitor?')) return;

      try {
        const res = await fetch('/api/admin?action=' + action, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify({ readerId })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          fetchDashboardData();
        } else {
          alert(data.error || 'Erro ao alterar acesso.');
        }
      } catch (err) {
        alert('Erro ao conectar.');
      }
    }

    function filterReaders() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allReaders.filter(r => 
        r.name.toLowerCase().includes(q) || 
        r.email.toLowerCase().includes(q) ||
        r.referral_code.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
